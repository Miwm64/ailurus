description: separate translation
sources:
  lib.asm: |
    .export printStr
    .export greeting
    .export counter

    ; printStr: r1 = pstr
    printStr:
        mov r2, (r1)+
        jz printStrDone
    printStrLoop:
        out 1, (r1)+
        dec r2
        jnz printStrLoop
    printStrDone:
        ret

    .section data
    counter:  .word 0
    .org 0x10                   ; greeting starts 16 bytes into this file's data
    greeting: .pstr "hello from lib.asm\n"
  main.asm: |
    .export _start
    .import printStr
    .import greeting
    .import counter

    #define TIMES 2

    #macro say, 1
    {
        mov r1, %0
        call printStr
    }

    _start:
        mov rsp, 0x1000
        mov r8, TIMES
    again:
        say greeting
        inc (counter)
        dec r8
        jnz again
    #ifdef VERBOSE
        say verbose
    #else
        say quiet
    #endif
        say counted
        mov r1, (counter)
        add r1, "0"
        out 1, r1
        out 1, "\n"
        halt

    .section data
    quiet:   .pstr "built without VERBOSE\n"
    verbose: .pstr "built with -D VERBOSE\n"
    counted: .pstr "counter (lib.asm) = "
build_args:
  - --no-stdlib
  - -D
  - VERBOSE
