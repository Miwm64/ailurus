name: CI

on:
    push:
        branches: [master, develop]
    pull_request:

jobs:
    gitlint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Lint git
              uses: aschbacd/gitlint-action@v1.2.0
              with:
                  re-branch-name: '^(master|develop|(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)/.+)$'
                  re-commit-message-subject: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
                  re-pull-request-title: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9-]+\))?!?: .+'
                  commit-message-subject-max-length: 72
                  commit-message-body-max-length: 100

    go-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - name: Lint golang
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.13

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - name: Run tests
              run: make test

    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - name: Build binaries
              run: make build

    tidy:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - name: Check go.mod is tidy
              run: |
                  go mod tidy
                  git diff --exit-code go.mod
