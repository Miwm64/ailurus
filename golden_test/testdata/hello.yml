description: prints a pstr, no stdlib
sources:
  main.asm: |
    .export _start
    _start:
        mov r1, msg
        mov r2, (r1)+
    loop:
        cmp r2, 0
        jz done
        out 1, (r1)+
        dec r2
        jump @loop
    done:
        halt
    .section data
    msg: .pstr "Hello, world!\n"
