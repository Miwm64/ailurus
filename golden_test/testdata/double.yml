description: 64-bit arithmetic - n! and 1! + ... + n! for n <= 20, printed in hex; journal over k = 12, 13 (> 1 word)
sources:
  main.asm: |
    .export _start
    .export _handler
    .import inputPush
    .import print
    .import printChar
    .import readLine
    .import strToInt

    #define MAX_N 20
    #define LINE_CAP 4

    ; r10:r9 = k!, r12:r11 = 1! + ... + k! (high:low)
    _start:
        mov rsp, 0x1000
        ei
        mov r1, line
        mov r2, LINE_CAP
        call readLine
        cmp r1, 0
        jl bad
        mov r1, line
        call strToInt
        cmp r2, 0
        jnz bad
        cmp r1, 0
        jl bad
        cmp r1, MAX_N
        jg bad
        mov r8, r1              ; n
        mov r9, 1
        clr r10
        clr r11
        clr r12
        mov r13, 1              ; k
    factLoop:
        cmp r13, r8
        jg factDone
        mov r1, r9
        umulh r1, r13           ; high word of low * k
        mull r9, r13
        mull r10, r13
        add r10, r1
        add r11, r9
        addc r12, r10
        inc r13
        jump @factLoop
    factDone:
        mov r1, factLabel
        call print
        mov r1, r9
        mov r2, r10
        call printHex
        mov r1, sumLabel
        call print
        mov r1, r11
        mov r2, r12
        call printHex
        halt
    bad:
        mov r1, badInput
        call print
        halt

    ; printHex: r1 = low word, r2 = high word; prints "0x", 16 hex digits, "\n"
    printHex:
        pushm r8, r9
        mov r8, r1
        mov r9, r2
        mov r1, "0"
        call printChar
        mov r1, "x"
        call printChar
        mov r1, r9
        call printHex32
        mov r1, r8
        call printHex32
        mov r1, "\n"
        call printChar
        popm r9, r8
        ret

    ; printHex32: r1 = word; prints 8 hex digits
    printHex32:
        pushm r8, r9
        mov r8, r1
        mov r9, 8
    printHex32Loop:
        mov r1, r8
        lsr r1, 28
        cmp r1, 10
        jb printHex32Digit
        add r1, 7               ; "A" - "0" - 10
    printHex32Digit:
        add r1, "0"
        call printChar
        lsl r8, 4
        dec r9
        jnz printHex32Loop
        popm r9, r8
        ret

    _handler:
        call inputPush
        iret

    .section data
    factLabel: .pstr "n!             = "
    sumLabel:  .pstr "1! + ... + n!  = "
    badInput:  .pstr "bad input\n"
    line:      .word 0, 0, 0, 0, 0  ; length + LINE_CAP characters
config: |
  tick_limit: 100000
  input:
    - [1000, "2"]
    - [1400, "0"]
    - [1800, "\n"]
  journal:
    mode: instr
    from_tick: 3414
    to_tick: 3524
