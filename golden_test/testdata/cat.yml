description: echoes input until the tick limit
sources:
  main.asm: |
    .export _start
    .export _handler
    .import inputPush
    .import readChar
    .import printChar

    _start:
        mov rsp, 0x1000
        ei
    loop:
        call readChar
        call printChar
        jump @loop

    _handler:
        call inputPush
        iret
config: |
  tick_limit: 3000
  input:
    - [100, "c"]
    - [400, "a"]
    - [700, "t"]
    - [1000, "\n"]
  journal:
    mode: tick
    from_tick: 96
    to_tick: 163
